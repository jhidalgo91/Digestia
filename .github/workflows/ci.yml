name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Disable Prisma telemetry to avoid firewall blocks on checkpoint.prisma.io
env:
  CHECKPOINT_DISABLE: "1"
  # Mock DATABASE_URL so prisma generate can run without a real DB
  DATABASE_URL: "mysql://ci:ci@localhost:3306/digestia_ci"
  NEXTAUTH_URL: "http://localhost:3000"
  # NEXTAUTH_SECRET is generated dynamically in the 'Generate NEXTAUTH_SECRET' step below

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Generate a random NEXTAUTH_SECRET for this CI run
      - name: Generate NEXTAUTH_SECRET
        run: echo "NEXTAUTH_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      # Generate Prisma Client (does not require a running DB)
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js application
        run: npm run build
        env:
          # Disable Next.js font optimization to avoid fetching from fonts.googleapis.com
          NEXT_DISABLE_FONT_OPTIMIZATION: "true"
