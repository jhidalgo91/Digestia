name: CI

on:
  push:
    branches: [main, "copilot/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          # Disable Prisma telemetry to avoid requiring outbound connections
          # to checkpoint.prisma.io during CI
          CHECKPOINT_DISABLE: "1"
          DATABASE_URL: "mysql://user:password@localhost:3306/digestia"

      - name: Run ESLint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Disable Prisma telemetry
          CHECKPOINT_DISABLE: "1"
          # Provide a dummy DATABASE_URL so Next.js does not crash on import
          DATABASE_URL: "mysql://user:password@localhost:3306/digestia"
          NEXTAUTH_SECRET: "ci-placeholder-secret"
          NEXTAUTH_URL: "http://localhost:3000"
          # Disable Next.js telemetry
          NEXT_TELEMETRY_DISABLED: "1"

  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          CHECKPOINT_DISABLE: "1"
          DATABASE_URL: "mysql://user:password@localhost:3306/digestia"

      - name: Run TypeScript compiler check
        run: npx tsc --noEmit
